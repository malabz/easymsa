name: Deploy easymsa to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_API_MODE: real
      VITE_API_BASE_URL: https://api.easymsa.cn/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Complete frontend validation
        uses: ./.github/actions/frontend-validation

      - name: Record deployed version
        run: >-
          node -e 'require("node:fs").writeFileSync("dist/release.json", JSON.stringify({commit: process.env.GITHUB_SHA, apiBaseUrl: process.env.VITE_API_BASE_URL}, null, 2) + "\n")'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
